#:schema https://mise.jdx.dev/schema/mise.json

[bootstrap.macos.dock]
autohide = false
orientation = "bottom"

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.trackpad]
tap_to_click = false

[bootstrap.packages]
"brew:stow" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:maccy" = "latest"
"brew-cask:monitorcontrol" = "latest"
"brew-cask:joplin" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:scroll-reverser" = "latest"
