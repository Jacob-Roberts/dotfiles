#:schema https://mise.jdx.dev/schema/mise.json

[bootstrap.macos.dock]
autohide = false
orientation = "bottom"

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.trackpad]
tap_to_click = false

[bootstrap.packages]
"brew:stow" = { version = "latest", os = ["macos"] }
"brew-cask:zed" = { version = "latest", os = ["macos"] }
"brew-cask:ghostty" = { version = "latest", os = ["macos"] }
"brew-cask:maccy" = { version = "latest", os = ["macos"] }
"brew-cask:monitorcontrol" = { version = "latest", os = ["macos"] }
"brew-cask:joplin" = { version = "latest", os = ["macos"] }
"brew-cask:rectangle" = { version = "latest", os = ["macos"] }
"brew-cask:scroll-reverser" = { version = "latest", os = ["macos"] }
